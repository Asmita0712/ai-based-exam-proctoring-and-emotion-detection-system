[pytest]
pythonpath = . backend
addopts = -p no:langsmith --durations=15 --strict-markers
markers =
    unit: Level 1 - Fast unit tests with mocked or lightweight dependencies (<60s target)
    integration: Level 2 - Integration tests verifying services, DB, auth, and state persistence
    slow: Computationally heavy or long-running tests
    ml: Level 3 - Actual machine learning model loading and inference (PyTorch, YOLOv8, MediaPipe)
    e2e: End-to-end examination lifecycle scenarios
