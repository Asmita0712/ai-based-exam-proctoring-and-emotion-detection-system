events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations for high concurrency (500 users)
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate limiting zones to protect backend during 500-concurrent bursts
    # General API: 100 requests/sec per IP with burst of 50
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    # Heavy AI Proctoring inference uploads: 20 requests/sec per student session
    limit_req_zone $binary_remote_addr zone=proctoring_limit:20m rate=20r/s;

    upstream backend_servers {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend SPA
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
                expires 7d;
                access_log off;
                add_header Cache-Control "public, max-age=604800, immutable";
            }
        }

        # FastAPI Backend Endpoints
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        # Dedicated route for high-frequency Proctoring events
        location /api/proctoring/ {
            limit_req zone=proctoring_limit burst=30 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Health & Readiness probes
        location /health {
            proxy_pass http://backend_servers/health;
            access_log off;
        }

        location /health/ready {
            proxy_pass http://backend_servers/health/ready;
            access_log off;
        }
    }
}
